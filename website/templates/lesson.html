{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}<a class="text-link" href="{{ url_for('lessons') }}">← All lessons</a><div class="page-heading"><p class="eyebrow">LESSON {{ number }}</p><h1>{{ title }}</h1></div><article class="lesson-content">{{ content }}</article>{% if not done %}<form method="post" action="{{ url_for('complete_lesson',number=number) }}"><button class="button" type="submit">Mark lesson as completed</button></form>{% else %}<p class="success-text">✓ You completed this lesson.</p>{% endif %}{% endblock %}
