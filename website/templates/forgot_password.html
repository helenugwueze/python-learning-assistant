{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Forgot Password?</h2>

    <p>Enter your registered email address.</p>

    <form method="POST">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">Reset Password</button>
    </form>
</div>
{% endblock %}
